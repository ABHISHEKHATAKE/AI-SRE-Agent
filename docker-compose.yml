# Local full stack:  docker compose up --build   -> app :8000, Prometheus :9090, Grafana :3000 (anonymous admin)
services:
  app:
    build: .
    ports: ["8000:8000"]
    environment: {GROQ_API_KEY: "${GROQ_API_KEY:-}", LIVE_TICK: "2"}
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [app]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
